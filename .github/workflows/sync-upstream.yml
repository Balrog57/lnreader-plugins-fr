name: Sync French plugins from upstream

on:
  schedule:
    # Every day at 03:17 UTC.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-french-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Merge upstream history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream-sync https://github.com/LNReader/lnreader-plugins.git
          git fetch upstream-sync master
          set +e
          git merge --no-commit --no-ff upstream-sync/master
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            node scripts/resolve-upstream-conflicts.js
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved upstream conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Project and validate French plugins
        shell: bash
        run: |
          npm run prune:french
          npm run test:unit
          npm run clean:multisrc
          npm run lint:french
          npm run build:full
          npm run check:french-manifest
          npm run check:french-live
          mapfile -t changed_code < <(git diff --name-only --diff-filter=ACMRT HEAD -- '*.js' '*.ts')
          if [ "${#changed_code[@]}" -gt 0 ]; then
            npx prettier --check "${changed_code[@]}"
          fi

      - name: Push tested synchronization
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet && ! git rev-parse -q --verify MERGE_HEAD; then
            echo "Already synchronized"
            exit 0
          fi
          git commit -m "chore: sync French plugins from upstream"
          git push origin HEAD:master
