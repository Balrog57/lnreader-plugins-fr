name: Publish Plugins

on:
  push:
    branches:
      - master
    paths:
      - 'plugins/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-plugins.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Validate French plugins
        shell: bash
        run: |
          npm run test:unit
          npm run clean:multisrc
          npm run lint:french
          npm run build:full
          npm run check:french-manifest
          npm run check:french-live

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Publish French plugins
        run: npm run publish:plugins 2>> $GITHUB_STEP_SUMMARY
        shell: bash
